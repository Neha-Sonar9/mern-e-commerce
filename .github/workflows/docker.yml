#goal: docker setup for both frontend and backend 
name: docker setup
on:
   push

jobs:
  docker-setting-up:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name: Docker setup  
        uses: docker/setup-buildx-action@v4
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 
  
      - name: setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install backend dependencies
        uses: ./backend
        run: npm ci

      - name: Install frontend dependencies
        uses: ./frontend
        run: npm ci --legacy-peer-deps


      - name: frontend docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}
      - name: scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"    
      - name: Push frontend image
        run: docker push ${{ vars.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}


      - name: Backend docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}  
      - name: scan Backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"       
      - name: Push Backend image
        run: docker push ${{ vars.DOCKER_USERNAME }}/mern-backend:${{ github.sha }} 




             


