#goal: docker setup for both frontend and backend 
name: docker setup
on:
  push

jobs:
  docker-setting-up:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: Docker setup  
        uses: docker/setup-buildx-action@v4

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 
  
  frontend-backend-docker-setup:
    runs-on: ubuntu-latest
    needs: docker-setting-up
    steps: 
      - name: frontend docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}

      - name: Backend docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}   

             


